# Production-style run on a single host (the VPS, or locally to test a production build).
# Builds the image on the machine and listens on 127.0.0.1:8080 only, so put a reverse proxy
# (Caddy/nginx) in front for HTTPS. For the GHCR-based deploy, see deploy/docker-compose.yml.
#
# One-time on the host:  mkdir -p data && sudo chown 1000:1000 data
services:
  app:
    build: .
    container_name: meet-capytech
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/data
    env_file:
      - .env
    # `environment` wins over `env_file`, so a .env copied from development
    # (NODE_ENV=development, DATA_DIR=./data) can't put the container in dev mode
    # or write the database outside the mounted volume.
    environment:
      NODE_ENV: production
      PORT: "8080"
      DATA_DIR: /data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
